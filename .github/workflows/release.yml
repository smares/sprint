name: Release

# Run manually (Actions → Release → Run workflow) with a version like 0.1.0 on main:
# builds the Docker image, pushes it to ghcr.io and creates the tag and the GitHub release.
# With "dry run" it only builds the image and publishes nothing; that works on any branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without "v", e.g. 0.1.0 or 1.0.0-rc.1
        required: true
        type: string
      dry_run:
        description: Only build the image, publish nothing
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    name: Image and release

    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$VERSION' is not a version like 1.2.3 or 1.2.3-rc.1 (without a leading v)."
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A release is made from main. Choose main in 'Use workflow from', or tick 'dry run'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag must not exist yet
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1 || git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already exists."
            exit 1
          fi

      # The credentials of Flux Pro go into the build as a secret and not into the image
      - name: Flux Pro credentials
        env:
          FLUX_USERNAME: ${{ secrets.FLUX_USERNAME }}
          FLUX_LICENSE_KEY: ${{ secrets.FLUX_LICENSE_KEY }}
        run: |
          if [ -z "$FLUX_USERNAME" ] || [ -z "$FLUX_LICENSE_KEY" ]; then
            echo "::error::FLUX_USERNAME and FLUX_LICENSE_KEY are missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          auth="$(jq -cn --arg user "$FLUX_USERNAME" --arg key "$FLUX_LICENSE_KEY" '{"http-basic": {"composer.fluxui.dev": {"username": $user, "password": $key}}}')"
          echo "::add-mask::$auth"
          {
            echo "COMPOSER_AUTH<<END_OF_AUTH"
            echo "$auth"
            echo "END_OF_AUTH"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Sprint
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-envs: composer_auth=COMPOSER_AUTH
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image contains the code of Flux Pro, whose license does not allow passing it on:
      # the package must stay private. Fails the release if it can be pulled without a login.
      - name: The image must not be public
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull" | jq -r .token)"
          status="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/$repository/manifests/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "::error::The package ghcr.io/$repository can be pulled without a login. Set it to private (profile → Packages → sprint → Package settings → Change visibility); the Flux Pro license does not allow publishing it."
            exit 1
          fi

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if echo "$VERSION" | grep -q -- '-'; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" $prerelease --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes \
            --notes "**Docker image:** \`$IMAGE:$VERSION\` (private; setup in [docs/deployment-docker.md](https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/docs/deployment-docker.md#fertiges-image))"
